name: Build Discord Selection Installer

on:
  push:
    branches: [discord-selection-installer]
    paths:
      - "ANDROID_DISCORD_SELECTION/project.zip.b64"
      - ".github/workflows/build-discord-selection-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/discord-selection-installer
          mkdir -p /tmp/discord-selection-installer
          base64 --ignore-garbage -d ANDROID_DISCORD_SELECTION/project.zip.b64 > /tmp/project.zip
          unzip -t /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/discord-selection-installer
          base64 --ignore-garbage -d /tmp/discord-selection-installer/release-key.jks.b64 > /tmp/discord-selection-installer/release-key.jks

      - name: Build signed APK
        working-directory: /tmp/discord-selection-installer
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p /tmp/artifact
          cp /tmp/discord-selection-installer/app/build/outputs/apk/release/app-release.apk /tmp/artifact/DiscordSelectionInstaller-v1.0.0.apk
          sha256sum /tmp/artifact/DiscordSelectionInstaller-v1.0.0.apk > /tmp/artifact/DiscordSelectionInstaller-v1.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiscordSelectionInstaller-v1.0.0
          path: /tmp/artifact/*
          if-no-files-found: error
