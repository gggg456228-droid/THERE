name: Build standalone Windows release

on:
  push:
    branches: [main]
    paths:
      - "WINDOWS_X64/source_payload/**"
      - "WINDOWS_X64/VERSION.txt"
      - ".github/workflows/build-windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: there-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore application source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item build_src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path build_src | Out-Null

          $payloadPath = "WINDOWS_X64/source_payload/app_payload_268.tar.xz.b64"
          if (-not (Test-Path $payloadPath)) { throw "Application payload is missing" }

          # The connector which originally uploaded this text payload can add
          # transport characters. Keep only legal Base64 symbols before decoding.
          $raw = Get-Content $payloadPath -Raw
          $b64 = $raw -replace '[^A-Za-z0-9+/=]',''
          if ($b64.Length -lt 100000) { throw "Application payload is unexpectedly short: $($b64.Length)" }

          $archive = Join-Path $env:RUNNER_TEMP "there-app-payload.tar.xz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          Write-Host "Decoded application payload bytes: $((Get-Item $archive).Length)"
          Write-Host "Decoded payload SHA256: $((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower())"

          tar -xJf $archive -C build_src
          if ($LASTEXITCODE -ne 0) { throw "Application payload extraction failed" }

          Copy-Item "WINDOWS_X64/source_payload/standalone_entry.py" "build_src/standalone_entry.py" -Force

          # Mutable state must never live in a one-file temporary extraction dir.
          $serverPath = "build_src/flask_server.py"
          $server = Get-Content $serverPath -Raw
          $server = $server.Replace('RESTART_SCHEDULE_FILE = os.path.join(os.path.dirname(__file__), ".restart_schedule.json")', 'RESTART_SCHEDULE_FILE = os.path.join(APP_DATA_DIR, ".restart_schedule.json")')
          $server = $server.Replace('PROMO_CODES_FILE = os.path.join(os.path.dirname(__file__), "promo_codes.json")', 'PROMO_CODES_FILE = os.path.join(APP_DATA_DIR, "promo_codes.json")')
          [IO.File]::WriteAllText((Resolve-Path $serverPath).Path, $server, [Text.UTF8Encoding]::new($false))

          $required = @(
            "standalone_entry.py",
            "flask_server.py",
            "embedded_templates.py",
            "auth_system.py",
            "backup_system.py",
            "captcha_system.py",
            "security_system.py"
          )
          foreach ($name in $required) {
            if (-not (Test-Path "build_src/$name")) { throw "Missing source file: $name" }
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pyinstaller Flask==3.1.3 waitress==3.0.2 reportlab==4.4.9

      - name: Smoke test source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile build_src/*.py
          $env:PYTHONPATH = (Resolve-Path build_src).Path
          $env:THERE_DATA_DIR = Join-Path $env:RUNNER_TEMP "there-source-smoke-data"
          python -c "from flask_server import app; c=app.test_client(); r=c.get('/healthz'); assert r.status_code == 200, r.status_code; print('SOURCE_HEALTHZ_OK', r.status_code)"

      - name: Compile one-file THERE.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item release -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item THERE.spec -Force -ErrorAction SilentlyContinue

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name THERE `
            --distpath release `
            --paths build_src `
            --hidden-import flask_server `
            --hidden-import embedded_templates `
            --hidden-import auth_system `
            --hidden-import backup_system `
            --hidden-import captcha_system `
            --hidden-import security_system `
            --collect-all reportlab `
            build_src/standalone_entry.py

          if (-not (Test-Path "release/THERE.exe")) { throw "THERE.exe was not built" }
          Write-Host "Built THERE.exe bytes: $((Get-Item 'release/THERE.exe').Length)"

      - name: Smoke test compiled EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:THERE_DATA_DIR = Join-Path $env:RUNNER_TEMP "there-exe-smoke-data"
          $env:THERE_DISABLE_UPDATE = "1"
          $env:THERE_NO_BROWSER = "1"
          & "release/THERE.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Compiled THERE.exe self-test failed with exit code $LASTEXITCODE" }

      - name: Create release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "WINDOWS_X64/VERSION.txt" -Raw).Trim()
          if ($version -ne "2.6.8") { throw "Unexpected version: $version" }

          $publish = Join-Path $env:RUNNER_TEMP "there-publish"
          $bundle = Join-Path $publish "bundle"
          Remove-Item $publish -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle "runtime/app") | Out-Null

          Copy-Item "release/THERE.exe" (Join-Path $bundle "THERE.exe")
          Copy-Item "WINDOWS_X64/VERSION.txt" (Join-Path $bundle "VERSION.txt")

          # Compatibility marker for the old 2.6.6 and 2.6.7 updaters.
          Copy-Item "WINDOWS_X64/source_payload/standalone_entry.py" (Join-Path $bundle "runtime/app/standalone_entry.py")

          @"
          THERE $version for Windows x64.

          Run THERE.exe.
          Python, Flask, Waitress, ReportLab and the complete THERE server are embedded in the executable.
          No Python installation, pip command or manual module installation is required.
          User data is stored in %LOCALAPPDATA%\THERE\data.
          "@ | Set-Content (Join-Path $bundle "README_FIRST.txt") -Encoding UTF8

          $zip = Join-Path $publish "THERE_WINDOWS_X64.zip"
          Compress-Archive -Path (Join-Path $bundle "*") -DestinationPath $zip -CompressionLevel Optimal

          $exeHash = (Get-FileHash "release/THERE.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  WINDOWS_X64/THERE.exe" | Set-Content (Join-Path $publish "THERE.exe.sha256") -Encoding ASCII
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @{
            version = $version
            windows_bundle_url = "https://raw.githubusercontent.com/gggg456228-droid/THERE/main/dist/THERE_WINDOWS_X64.zip"
            sha256 = $zipHash
          } | ConvertTo-Json | Set-Content (Join-Path $publish "latest.json") -Encoding UTF8

      - name: Upload tested release artifact
        uses: actions/upload-artifact@v4
        with:
          name: THERE_WINDOWS_X64_2.6.8
          path: |
            release/THERE.exe
            ${{ runner.temp }}/there-publish/THERE_WINDOWS_X64.zip
            ${{ runner.temp }}/there-publish/latest.json
          if-no-files-found: error

      - name: Commit generated release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $publish = Join-Path $env:RUNNER_TEMP "there-publish"

          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git fetch origin main
            git reset --hard origin/main

            New-Item -ItemType Directory -Force -Path WINDOWS_X64, dist, update | Out-Null
            Copy-Item (Join-Path $publish "bundle/THERE.exe") "WINDOWS_X64/THERE.exe" -Force
            Copy-Item (Join-Path $publish "THERE.exe.sha256") "WINDOWS_X64/THERE.exe.sha256" -Force
            Copy-Item (Join-Path $publish "THERE_WINDOWS_X64.zip") "dist/THERE_WINDOWS_X64.zip" -Force
            Copy-Item (Join-Path $publish "latest.json") "update/latest.json" -Force

            git add WINDOWS_X64/THERE.exe WINDOWS_X64/THERE.exe.sha256 dist/THERE_WINDOWS_X64.zip update/latest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Generated release is already current."
              exit 0
            }

            git commit -m "Build standalone Windows release 2.6.8 [skip ci]"
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }

            Write-Host "Push raced with another commit. Retry $attempt of 4."
            Start-Sleep -Seconds 2
          }
          throw "Unable to publish generated release after retries"
