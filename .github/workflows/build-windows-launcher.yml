name: Build Windows update

on:
  push:
    branches: [main]
    paths:
      - "WINDOWS_X64/launcher_source/**"
      - "WINDOWS_X64/runtime/app/**"
      - "WINDOWS_X64/VERSION.txt"
      - "requirements.txt"
      - ".github/workflows/build-windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: there-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build launcher and update bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/there-release
          mkdir -p /tmp/there-release/bundle/runtime/app
          mkdir -p /tmp/there-release/bundle/runtime/packages

          pushd WINDOWS_X64/launcher_source >/dev/null
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o /tmp/there-release/bundle/THERE.exe .
          popd >/dev/null

          cp WINDOWS_X64/VERSION.txt /tmp/there-release/bundle/VERSION.txt

          # The complete application source is stored as one archive so the
          # repository cannot accidentally publish a half-populated runtime.
          unzip -q WINDOWS_X64/runtime/app/full_app.zip -d /tmp/there-release/bundle/runtime/app

          # Vendor dependencies into the portable update. Native Linux speedup
          # modules are optional and are removed so the payload stays portable
          # across Windows Python 3.10+ installations.
          python -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --target /tmp/there-release/bundle/runtime/packages \
            -r requirements.txt
          find /tmp/there-release/bundle/runtime/packages -type f -name '*.so' -delete
          find /tmp/there-release/bundle/runtime/packages -type d -name '__pycache__' -prune -exec rm -rf {} + || true

          test -f /tmp/there-release/bundle/runtime/app/standalone_entry.py
          test -f /tmp/there-release/bundle/runtime/app/flask_server.py
          test -f /tmp/there-release/bundle/runtime/app/embedded_templates.py
          test -d /tmp/there-release/bundle/runtime/packages/flask
          test -d /tmp/there-release/bundle/runtime/packages/waitress

          cat > /tmp/there-release/bundle/README_FIRST.txt <<'READMEEOF'
          THERE Windows update payload.
          THERE.exe checks GitHub for a newer version on startup and installs it automatically.
          User data is stored outside the application folder under %LOCALAPPDATA%\THERE\data.
          READMEEOF

          mkdir -p /tmp/there-release/dist
          (cd /tmp/there-release/bundle && zip -9 -r /tmp/there-release/dist/THERE_WINDOWS_X64.zip . >/dev/null)
          sha256sum /tmp/there-release/bundle/THERE.exe | awk '{print $1 "  WINDOWS_X64/THERE.exe"}' > /tmp/there-release/THERE.exe.sha256
          SHA=$(sha256sum /tmp/there-release/dist/THERE_WINDOWS_X64.zip | awk '{print $1}')
          VERSION=$(tr -d '\r\n ' < WINDOWS_X64/VERSION.txt)

          mkdir -p /tmp/there-release/update
          cat > /tmp/there-release/update/latest.json <<JSONEOF
          {
            "version": "${VERSION}",
            "windows_bundle_url": "https://raw.githubusercontent.com/gggg456228-droid/THERE/main/dist/THERE_WINDOWS_X64.zip",
            "sha256": "${SHA}"
          }
          JSONEOF

      - name: Commit generated updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p WINDOWS_X64 dist update
            cp /tmp/there-release/bundle/THERE.exe WINDOWS_X64/THERE.exe
            cp /tmp/there-release/THERE.exe.sha256 WINDOWS_X64/THERE.exe.sha256
            cp /tmp/there-release/dist/THERE_WINDOWS_X64.zip dist/THERE_WINDOWS_X64.zip
            cp /tmp/there-release/update/latest.json update/latest.json

            git add WINDOWS_X64/THERE.exe WINDOWS_X64/THERE.exe.sha256 dist/THERE_WINDOWS_X64.zip update/latest.json
            if git diff --cached --quiet; then
              echo "Generated files are already current."
              exit 0
            fi

            git commit -m "Build Windows update [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another commit; retrying (${attempt}/4)..."
            sleep 2
          done

          echo "Unable to publish generated update after retries."
          exit 1
