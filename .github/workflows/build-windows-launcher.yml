name: Build standalone Windows release

on:
  push:
    branches:
      - main
    paths:
      - 'WINDOWS_X64/runtime/app/**'
      - 'WINDOWS_X64/VERSION.txt'
      - '.github/workflows/build-windows-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item build_src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build_src | Out-Null
          Copy-Item 'WINDOWS_X64/runtime/app/*' 'build_src/' -Recurse -Force
          $required = @('standalone_entry.py','flask_server.py','embedded_templates.py','auth_system.py','backup_system.py','captcha_system.py','security_system.py','github_character_sync.py')
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path 'build_src' $file))) { throw "Missing source file: $file" }
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pyinstaller Flask==3.1.3 waitress==3.0.2 reportlab==4.4.9

      - name: Test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:THERE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'there-source-test'
          python -c "import sys; sys.path.insert(0, r'build_src'); from flask_server import app; r=app.test_client().get('/healthz'); assert r.status_code == 200, r.status_code; print('SOURCE_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Source test failed' }

      - name: Build THERE.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item release -Recurse -Force -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean --onefile --console --name THERE --distpath release --paths build_src --hidden-import flask_server --hidden-import embedded_templates --hidden-import auth_system --hidden-import backup_system --hidden-import captcha_system --hidden-import security_system --collect-all reportlab build_src/standalone_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path 'release/THERE.exe')) { throw 'THERE.exe missing' }

      - name: Test compiled executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:THERE_DISABLE_UPDATE = '1'
          $env:THERE_NO_BROWSER = '1'
          $env:THERE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'there-exe-test'
          & 'release/THERE.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'THERE.exe self test failed' }

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'WINDOWS_X64/VERSION.txt' -Raw).Trim()
          if ($version -ne '2.6.9') { throw "Unexpected version: $version" }
          Remove-Item publish -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'publish/bundle/runtime/app' | Out-Null
          Copy-Item 'release/THERE.exe' 'publish/bundle/THERE.exe'
          Copy-Item 'WINDOWS_X64/VERSION.txt' 'publish/bundle/VERSION.txt'
          Copy-Item 'WINDOWS_X64/runtime/app/standalone_entry.py' 'publish/bundle/runtime/app/standalone_entry.py'
          Set-Content -Path 'publish/bundle/README_FIRST.txt' -Value 'Run THERE.exe. No Python or pip installation is required.' -Encoding utf8
          Compress-Archive -Path 'publish/bundle/*' -DestinationPath 'publish/THERE_WINDOWS_X64.zip' -CompressionLevel Optimal
          $exeHash = (Get-FileHash 'release/THERE.exe' -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path 'publish/THERE.exe.sha256' -Value "$exeHash  WINDOWS_X64/THERE.exe" -Encoding ascii
          $zipHash = (Get-FileHash 'publish/THERE_WINDOWS_X64.zip' -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{version=$version;windows_bundle_url='https://raw.githubusercontent.com/gggg456228-droid/THERE/main/dist/THERE_WINDOWS_X64.zip';sha256=$zipHash} | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'publish/latest.json'), $manifest, [Text.UTF8Encoding]::new($false))

      - name: Publish tested release to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          New-Item -ItemType Directory -Force -Path 'dist','update' | Out-Null
          Copy-Item 'release/THERE.exe' 'WINDOWS_X64/THERE.exe' -Force
          Copy-Item 'publish/THERE.exe.sha256' 'WINDOWS_X64/THERE.exe.sha256' -Force
          Copy-Item 'publish/THERE_WINDOWS_X64.zip' 'dist/THERE_WINDOWS_X64.zip' -Force
          Copy-Item 'publish/latest.json' 'update/latest.json' -Force
          git add WINDOWS_X64/THERE.exe WINDOWS_X64/THERE.exe.sha256 dist/THERE_WINDOWS_X64.zip update/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already current'; exit 0 }
          git commit -m 'Build standalone Windows release 2.6.9 [skip ci]'
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }
