plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.pluf255.there'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pluf255.there'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '2.6.10-mobile'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            python.srcDirs = ['src/main/python', '../../../WINDOWS_X64/runtime/app']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install 'Flask==3.1.3'
            install 'reportlab==4.4.9'
        }
        pyc {
            src = true
            pip = true
        }
    }
}
